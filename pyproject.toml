[project]
name = "self-correcting-rag"
version = "0.1.0"
description = "An agentic, self-correcting RAG system built on LangGraph and Qdrant."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # --- Agent orchestration ---
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    # --- LLM providers (selected at runtime via settings, not imported directly) ---
    "langchain-google-genai",
    "langchain-groq",
    # --- Retrieval ---
    "langchain-qdrant>=1.1,<2",
    "langchain-text-splitters>=1.1,<2",
    "qdrant-client>=1.15,<2",
    "fastembed>=0.8,<0.9",
    # --- Documents & tokens ---
    "pymupdf4llm>=1.28,<2",
    "tiktoken>=0.14,<1",
    # --- Configuration ---
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
ui = ["gradio>=6.26,<7"]
tracing = ["langfuse>=4.15,<5"]

[project.scripts]
self-rag = "self_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/self_rag"]

# ----------------------------------------------------------------------------
# Lint / format
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Ruff formats Python code blocks inside Markdown. BLUEPRINT.md deliberately reproduces the
# reference implementation verbatim, so reformatting it would defeat its purpose.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # prefer pathlib over os.path
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/self_rag/agent/prompts.py" = ["E501"]
"src/self_rag/agent/state.py" = ["N815"]

# ----------------------------------------------------------------------------
# Type checking
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

# These third-party packages ship no type information.
[[tool.mypy.overrides]]
module = [
    "fastembed.*",
    "pymupdf.*",
    "pymupdf4llm.*",
    "qdrant_client.*",
    "langchain_qdrant.*",
    "langgraph.*",
    "tiktoken.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Tests
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: tests that touch real models, network, or on-disk services",
]
